name: CI Centinela

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Tests ingestion-api
        working-directory: backend/ingestion-api
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Tests scoring-engine
        working-directory: backend/scoring-engine
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Tests explanation-service
        working-directory: backend/explanation-service
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Tests document-service
        working-directory: backend/document-service
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Tests case-service
        working-directory: backend/case-service
        run: |
          sudo apt-get update && sudo apt-get install -y unixodbc-dev
          python -m pip install -r requirements.txt
          python -m pytest -q
        env:
          CASE_STORE: sqlite
          SQLITE_PATH: ./data/ci_test_cases.db
          AUTH_JWT_SECRET: ci-test-secret-not-for-prod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/analyst-dashboard/package-lock.json

      - name: Build frontend
        working-directory: frontend/analyst-dashboard
        run: |
          npm ci
          npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta tags
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA='${{ github.sha }}'
          echo "api=${{ env.REGISTRY }}/${OWNER}/centinela-ingestion-api" >> "$GITHUB_OUTPUT"
          echo "scoring=${{ env.REGISTRY }}/${OWNER}/centinela-scoring-engine" >> "$GITHUB_OUTPUT"
          echo "cases=${{ env.REGISTRY }}/${OWNER}/centinela-case-service" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build & push ingestion-api
        uses: docker/build-push-action@v6
        with:
          context: backend/ingestion-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.api }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push scoring-engine
        uses: docker/build-push-action@v6
        with:
          context: backend/scoring-engine
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.scoring }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.scoring }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push case-service
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/case-service/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.cases }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.cases }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Requiere que exista un App Registration + credencial federada OIDC en Azure
  # AD (ver docs/architecture/decisions.md "CD real — activación pendiente") y
  # las variables de repo AZURE_CLIENT_ID / AZURE_TENANT_ID /
  # AZURE_SUBSCRIPTION_ID / ENABLE_AZURE_DEPLOY=true. Hasta entonces este job
  # queda "skipped" en cada run — no es un job roto, es un job apagado.
  deploy-azure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_AZURE_DEPLOY == 'true'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build images en ACR
        # Las Container Apps reales tiran de acrcentineladev05.azurecr.io, no
        # de GHCR (confirmado 2026-07-30 vía `az containerapp show`) — GHCR
        # arriba es solo caché/artefacto gratis, no lo que corre en Azure.
        # az acr build construye del lado de ACR (plano de gestión, cubierto
        # por el rol Contributor del service principal), sin necesitar un
        # segundo docker login/push data-plane.
        run: |
          TAG="${{ needs.docker.outputs.tag }}"
          pids=()
          az acr build --registry acrcentineladev05 --image "centinela-ingestion-api:$TAG" backend/ingestion-api & pids+=($!)
          az acr build --registry acrcentineladev05 --image "centinela-scoring-engine:$TAG" backend/scoring-engine & pids+=($!)
          az acr build --registry acrcentineladev05 --image "centinela-case-service:$TAG" -f backend/case-service/Dockerfile backend & pids+=($!)
          fail=0
          for pid in "${pids[@]}"; do wait "$pid" || fail=1; done
          exit $fail

      - name: Deploy Container Apps (idempotente)
        run: |
          bash infrastructure/scripts/deploy-idempotent.sh "${{ needs.docker.outputs.tag }}"
